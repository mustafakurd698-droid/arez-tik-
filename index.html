<div class="video">
  <h2>❤️ ArezTik Video</h2>

  <button onclick="addLike()">
    ❤️ Like <span id="likeCount">0</span>
  </button>

  <input id="commentText" placeholder="Write a comment...">

  <button onclick="addComment()">Send 💬</button>

  <div id="commentList"></div>
</div>

<script>
let likes = 0;

function addLike() {
  likes++;
  document.getElementById("likeCount").innerText = likes;
}

function addComment() {
  let text = document.getElementById("commentText").value;
  if (text.trim() !== "") {
    let p = document.createElement("p");
    p.innerText = "💬 " + text;
    document.getElementById("commentList").appendChild(p);
    document.getElementById("commentText").value = "";
  }
}
</script>
