<!DOCTYPE html>
<html>
<head>
<title>ArezTik</title>
<style>
body {
  background: black;
  color: white;
  text-align: center;
  font-family: Arial;
}
h1 { color: hotpink; }
video {
  width: 90%;
  max-width: 400px;
  margin: 15px;
}
button {
  background: hotpink;
  color: white;
  padding: 12px;
  border: none;
  border-radius: 10px;
}
</style>
</head>
<body>

<h1>❤️ ArezTik</h1>
<h2>Welcome to ArezTik!</h2>

<h3>🎬 Upload Your Video</h3>
<input type="file" accept="video/*" id="file">

<video id="preview" controls></video>

<script>
document.getElementById("file").onchange = function() {
  let video = this.files[0];
  if(video) {
    document.getElementById("preview").src =
      URL.createObjectURL(video);
  }
};
</script>

</body>
</html>
